<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 415" role="img" aria-labelledby="title desc"><title id="title">四个网络窗口的实际抓取结果</title><desc id="desc">同一照片指令下，两份未来起点A和B。原生A奶酪B牛奶。前15次去噪第1到18层切未来到当前：A牛奶B未抓起；第19到36层：A奶酪B未抓起。后15次两种层范围都是A奶酪B牛奶。</desc><rect width="860" height="415" rx="12" fill="#f5f8fc"/><g font-family="system-ui,Noto Sans CJK SC,sans-serif" fill="#253143"><text x="430" y="37" text-anchor="middle" font-size="23" font-weight="bold">切同一条连接，只改变层数和计算时刻</text><text x="430" y="66" text-anchor="middle" font-size="17">连接保留时：A 抓奶酪盒，B 抓牛奶</text><text x="320" y="108" text-anchor="middle" font-size="20">第1～18层</text><text x="635" y="108" text-anchor="middle" font-size="20">第19～36层</text><g stroke="#c4d2e3"><rect x="172" y="123" width="295" height="113" rx="8" fill="#e8f2ef"/><rect x="487" y="123" width="295" height="113" rx="8" fill="#fff0e0"/><rect x="172" y="257" width="295" height="113" rx="8" fill="#edf2f8"/><rect x="487" y="257" width="295" height="113" rx="8" fill="#edf2f8"/></g><g font-size="19"><text x="25" y="164">前半段</text><text x="25" y="194" font-size="16">去噪1～15次</text><text x="25" y="298">后半段</text><text x="25" y="328" font-size="16">去噪16～30次</text><text x="194" y="150" font-size="15" font-weight="bold">事先选定的主要检验</text><text x="194" y="182">A：改抓牛奶</text><text x="194" y="212">B：未达到严格抓起</text><text x="509" y="182">A：仍抓奶酪盒</text><text x="509" y="212">B：未达到严格抓起</text><text x="194" y="302">A：仍抓奶酪盒</text><text x="194" y="338">B：仍抓牛奶</text><text x="509" y="302">A：仍抓奶酪盒</text><text x="509" y="338">B：仍抓牛奶</text></g><text x="430" y="398" text-anchor="middle" font-size="15">这里的“前后”是生成首轮动作时的内部计算，不是机械臂执行步数。</text></g></svg>